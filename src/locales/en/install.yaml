---
shared:
  components:
    cancel:
      text: Cancel
    change:
      text: Change Systems & Features
starting: |-
  Here's what Roll It has installed on this server:
  **Systems:** {{systems, list}}
  **Features:** {{features, list}}
  Combined, these enable the following commands:
  {{commands, list}}
  -# These global commands are always available: {{globals, list}}
  What do you want to change?
cancelled: >-
  Cancelled. No changes were made to the server's installed commands.
finished: >-
  That old setup request has finished. If you want to change what parts of Roll
  It are available on this server, run `/setup-roll-it` again.
change-installed:
  title: Change Installed Systems & Features
  prompt: >-
    Choose which of Roll It's game systems and extra features you want to install to this
    server. The ones currently installed are already selected below.
  systems:
    placeholder: Add game systems
  features:
    placeholder: Add other features
  afterward: >-
    The commands needed for your selections will be shown after you click Submit.
    You'll have a chance to review them before any changes are made to the server.
